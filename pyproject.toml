[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-fraud-detection-system"
version = "0.1.0"
description = "Reproducible historical transaction fraud review prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "scikit-learn==1.6.1",
  "scipy==1.15.3", "joblib==1.4.2", "threadpoolctl==3.6.0",
  "matplotlib==3.10.3", "duckdb==1.3.0", "fastapi==0.115.12",
  "pydantic==2.11.5", "uvicorn==0.34.2"
]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.11"]
[project.scripts]
fraud = "fraud_detection.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
extend-exclude = [".cache", ".venv", "data", "artifacts"]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
